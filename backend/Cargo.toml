[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
godcore = { path = "../game/crates/godcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Same float settings as the game: the server re-runs battles and must get
# the exact result the attacker's machine got.
[profile.release]
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 2
