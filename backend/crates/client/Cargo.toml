[package]
name = "bag-client"
version.workspace = true
edition.workspace = true
description = "Client library for the Legion of Minds server, for the desktop game, plus the bagctl CLI"

[dependencies]
bag-protocol = { path = "../protocol" }
godcore.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "gzip"] }
flate2 = "1"

[[bin]]
name = "bagctl"
path = "src/bin/bagctl.rs"

[[bin]]
name = "bagsim"
path = "src/bin/bagsim.rs"
