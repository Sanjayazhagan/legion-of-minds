[package]
name = "bag-client"
version.workspace = true
edition.workspace = true
description = "Client library for the Become a God server, for the desktop game, plus the bagctl CLI"

[dependencies]
bag-protocol = { path = "../protocol" }
godcore.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[[bin]]
name = "bagctl"
path = "src/bin/bagctl.rs"
