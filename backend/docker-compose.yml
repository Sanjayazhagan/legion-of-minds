# Local server with its own Postgres and the test login on:
#   docker compose up --build
# then point the game or bagctl at http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bag
      POSTGRES_PASSWORD: bag
      POSTGRES_DB: bag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bag"]
      interval: 2s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://bag:bag@db/bag
      PUBLIC_URL: http://localhost:8080
      DEV_LOGIN: "true"
      # Optional, to try real sign-in locally (see README):
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}

volumes:
  pgdata:
