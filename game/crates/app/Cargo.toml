[package]
name = "become-a-god"
version.workspace = true
edition.workspace = true
description = "Become a God: train tiny RL troops on your own machine and send them into battle"

[dependencies]
gltf = { version = "1", default-features = false, features = ["names", "utils"] }
godcore = { path = "../godcore" }
macroquad = "0.4"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# Online play: the server's own client library (backend/crates/client).
bag-client = { path = "../../../backend/crates/client" }
