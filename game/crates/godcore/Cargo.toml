[package]
name = "godcore"
version.workspace = true
edition.workspace = true
description = "Deterministic battle simulation and on-device PPO training for Legion of Minds"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[[bin]]
name = "godctl"
path = "src/bin/godctl.rs"
